[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "raggem"
version = "2.0.0"
description = "Hardened RAG service with REST API, CLI and optional MCP server."
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.10"
authors = [{ name = "RagGem maintainers" }]
keywords = ["rag", "retrieval-augmented-generation", "gemini", "chromadb", "fastapi", "mcp"]
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: POSIX :: Linux",
    "Operating System :: MacOS :: MacOS X",
    "Operating System :: Microsoft :: Windows",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "google-genai>=1.0,<2.0",
    "chromadb>=0.5,<2.0",
    "PyMuPDF>=1.27,<2.0",
    "python-dotenv>=1.0,<2.0",
    "fastapi>=0.115,<1.0",
    "uvicorn>=0.30,<1.0",
    "pydantic>=2.7,<3.0",
    "python-multipart>=0.0.12,<1.0",
]

[project.optional-dependencies]
mcp = ["mcp>=1.0"]
dev = ["pytest>=8.0", "httpx>=0.27"]

[project.scripts]
raggem = "raggem.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
include = ["raggem*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-ra --strict-markers"
